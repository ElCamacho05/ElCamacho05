<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="35%" stop-color="#22d3ee"/>
      <stop offset="70%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <style>
      .mono{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
      .sans{font-family:'Segoe UI',-apple-system,Helvetica,Arial,sans-serif}
      .cursor{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .n{animation:pulse 3s ease-in-out infinite}
      .d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}.d4{animation-delay:1.6s}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    </style>
  </defs>

  <!-- ventana -->
  <rect x="1" y="1" width="898" height="238" rx="14" fill="#0d1117" stroke="#30363d"/>
  <circle cx="26" cy="24" r="6" fill="#f87171"/>
  <circle cx="46" cy="24" r="6" fill="#fbbf24"/>
  <circle cx="66" cy="24" r="6" fill="#34d399"/>
  <text x="450" y="29" text-anchor="middle" class="mono" font-size="12" fill="#6e7681">~/ElCamacho05 — zsh</text>
  <line x1="1" y1="44" x2="899" y2="44" stroke="#21262d"/>

  <!-- texto -->
  <text x="40" y="82" class="mono" font-size="15" fill="#8b949e"><tspan fill="#34d399" font-weight="700">&gt;</tspan> python <tspan fill="#22d3ee">whoami.py</tspan></text>
  <text x="40" y="132" class="sans" font-size="38" font-weight="700" fill="#e6edf3">José Manuel Camacho</text>
  <text x="40" y="166" class="mono" font-size="17" font-weight="600" fill="url(#g)">Software Engineer · AI &amp; Machine Learning</text>
  <text x="40" y="200" class="mono" font-size="13" fill="#8b949e">full-stack · backend concurrente · audio AI · OCR <tspan class="cursor" fill="#a78bfa" font-weight="700">_</tspan></text>

  <!-- red neuronal -->
  <g stroke="#30363d" stroke-width="1.2">
    <line x1="640" y1="90" x2="730" y2="75"/><line x1="640" y1="90" x2="730" y2="125"/><line x1="640" y1="90" x2="730" y2="175"/>
    <line x1="640" y1="140" x2="730" y2="75"/><line x1="640" y1="140" x2="730" y2="125"/><line x1="640" y1="140" x2="730" y2="175"/>
    <line x1="640" y1="190" x2="730" y2="75"/><line x1="640" y1="190" x2="730" y2="125"/><line x1="640" y1="190" x2="730" y2="175"/>
    <line x1="730" y1="75" x2="820" y2="110"/><line x1="730" y1="125" x2="820" y2="110"/><line x1="730" y1="175" x2="820" y2="110"/>
    <line x1="730" y1="75" x2="820" y2="160"/><line x1="730" y1="125" x2="820" y2="160"/><line x1="730" y1="175" x2="820" y2="160"/>
  </g>
  <circle class="n" cx="640" cy="90" r="9" fill="#a78bfa"/>
  <circle class="n d1" cx="640" cy="140" r="9" fill="#a78bfa"/>
  <circle class="n d2" cx="640" cy="190" r="9" fill="#a78bfa"/>
  <circle class="n d1" cx="730" cy="75" r="9" fill="#22d3ee"/>
  <circle class="n d3" cx="730" cy="125" r="9" fill="#22d3ee"/>
  <circle class="n d2" cx="730" cy="175" r="9" fill="#34d399"/>
  <circle class="n d4" cx="820" cy="110" r="9" fill="#f472b6"/>
  <circle class="n d3" cx="820" cy="160" r="9" fill="#fbbf24"/>

  <!-- franja -->
  <rect x="1" y="232" width="898" height="6" rx="3" fill="url(#g)"/>
</svg>
